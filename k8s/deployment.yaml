apiVersion: apps/v1

kind: Deployment

metadata:
  name: devops-task-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-task-api

  template:
    metadata:
      labels:
        app: devops-task-api

    spec:
      containers:
        - name: devops-task-api
          image: akashfrancis/devops-task-api:27
          ports:
            - containerPort: 5000
